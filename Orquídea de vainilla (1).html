<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orquídea de vainilla</title>
<style>
:root{--panel:rgba(255,255,255,.88);--ink:#1d3a24;--track:#cfe3c4;--fill:#3f9b3c;--btn:#2f7d32;--btnink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(18,34,24,.88);--ink:#e3f2dc;--track:#2b4a31;--fill:#7fcf5a;--btn:#7fcf5a;--btnink:#10260f}}
:root[data-theme="dark"]{--panel:rgba(18,34,24,.88);--ink:#e3f2dc;--track:#2b4a31;--fill:#7fcf5a;--btn:#7fcf5a;--btnink:#10260f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#9bd4f5;overflow:hidden;font-family:Georgia,"Times New Roman",serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(92vw,420px);
background:var(--panel);color:var(--ink);border-radius:16px;padding:14px 16px;backdrop-filter:blur(6px)}
.ui h1{font-size:1.05rem;margin:0 0 2px;font-weight:700}
.ui p{margin:0 0 10px;font-size:.92rem;line-height:1.4}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:0;background:var(--fill)}
.row{display:flex;gap:8px}
button{flex:1;font:inherit;font-size:.95rem;padding:10px 12px;border-radius:10px;border:2px solid var(--btn);cursor:pointer;background:var(--btn);color:var(--btnink)}
button.alt{background:transparent;color:var(--ink);border-color:var(--track)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<canvas id="c" aria-label="Una orquídea de vainilla creciendo en un campo verde bajo un cielo azul" role="img"></canvas>
<div class="ui">
  <h1>Orquídea de vainilla</h1>
  <p id="stage">Esqueje recién plantado</p>
  <div class="bar"><i id="fill"></i></div>
  <div class="row">
    <button id="water">Regar</button>
    <button id="reset" class="alt">Empezar de nuevo</button>
  </div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const mot=matchMedia('(prefers-reduced-motion: reduce)').matches?0:1;
let W,H,px,py,hy,Hm,sc;
function rnd(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rnd(7);
let blades=[],dots=[],clouds=[];
function resize(){
  const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
  px=W/2;py=H*.8;hy=H*.5;Hm=Math.min(H*.55,520);sc=Math.max(.6,Math.min(1.1,Hm/480));
  blades=[];dots=[];
  for(let i=0;i<340;i++){const y=hy+40+R()*(H-hy-40);blades.push({x:R()*W,y,p:R()*6.28,g:R()});}
  blades.sort((a,b)=>a.y-b.y);
  for(let i=0;i<45;i++)dots.push({x:R()*W,y:hy+50+R()*(H-hy-60),c:['#fff','#ffe66b','#d9a8ff'][i%3]});
  if(!clouds.length)for(let i=0;i<5;i++)clouds.push({x:R()*W,y:30+R()*H*.22,s:.6+R()*.8,v:6+R()*8});
}
addEventListener('resize',resize);resize();

let g=0,drops=[],wet=0,last=performance.now(),lastStage='';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=v=>v*v*(3-2*v);

function sky(){
  const s=x.createLinearGradient(0,0,0,hy+20);s.addColorStop(0,'#2f8fe6');s.addColorStop(1,'#bfe7ff');
  x.fillStyle=s;x.fillRect(0,0,W,H);
  const sx=W*.82,sy=H*.14,gl=x.createRadialGradient(sx,sy,10,sx,sy,130);
  gl.addColorStop(0,'rgba(255,250,210,.95)');gl.addColorStop(.3,'rgba(255,245,180,.35)');gl.addColorStop(1,'rgba(255,245,180,0)');
  x.fillStyle=gl;x.fillRect(sx-140,sy-140,280,280);
  x.fillStyle='#fffbe0';x.beginPath();x.arc(sx,sy,30,0,6.29);x.fill();
}
function cloud(o){
  x.fillStyle='rgba(255,255,255,.93)';
  [[0,0,26],[28,-8,32],[62,0,26],[30,8,26],[-14,8,18],[80,8,16]].forEach(p=>{x.beginPath();x.arc(o.x+p[0]*o.s,o.y+p[1]*o.s,p[2]*o.s,0,6.29);x.fill();});
}
function hill(base,amp,f,ph,col){
  x.fillStyle=col;x.beginPath();x.moveTo(0,H);
  for(let i=0;i<=W;i+=12)x.lineTo(i,base+Math.sin(i*f+ph)*amp);
  x.lineTo(W,H);x.fill();
}
function field(){
  mountains();
  hill(hy-18,22,.004,1,'#8fd18a');
  hill(hy+8,18,.006,3,'#64bd5c');
  trees();const f=x.createLinearGradient(0,hy+30,0,H);f.addColorStop(0,'#58b74c');f.addColorStop(1,'#2c8532');
  x.fillStyle=f;x.fillRect(0,hy+36,W,H);
  dots.forEach(d=>{x.fillStyle=d.c;x.beginPath();x.arc(d.x,d.y,2.2,0,6.29);x.fill();});
}
function mountains(){
  [['#a9cdee',70,.0045,.5,hy-30],['#8fb9e3',50,.007,2,hy-10]].forEach(m=>{
    x.fillStyle=m[0];x.beginPath();x.moveTo(0,H);
    for(let i=0;i<=W;i+=10)x.lineTo(i,m[4]-Math.abs(Math.sin(i*m[2]+m[3]))*m[1]);
    x.lineTo(W,H);x.fill();});
}
function trees(){
  const hx=W*.18,hyy=hy+14+Math.sin(hx*.006+3)*18;
  x.fillStyle='#e8ddc8';x.fillRect(hx-18*sc,hyy-22*sc,36*sc,22*sc);
  x.fillStyle='#b5523b';x.beginPath();x.moveTo(hx-24*sc,hyy-22*sc);x.lineTo(hx,hyy-42*sc);x.lineTo(hx+24*sc,hyy-22*sc);x.fill();
  x.fillStyle='#7a5535';x.fillRect(hx-4*sc,hyy-12*sc,8*sc,12*sc);
  [[.04,.8],[.33,.65],[.7,.7],[.84,.95],[.95,.75]].forEach(t=>{
    const tx=W*t[0],ty=hy+12+Math.sin(tx*.006+3)*18,s=t[1]*sc;
    x.fillStyle='#6b4a2c';x.fillRect(tx-3*s,ty-26*s,6*s,30*s);
    [['#2f8a3a',0,-40,22],['#3f9d45',-12,-32,16],['#46a84b',12,-32,16]].forEach(b=>{x.fillStyle=b[0];x.beginPath();x.arc(tx+b[1]*s,ty+b[2]*s,b[3]*s,0,6.29);x.fill();});
  });
}
function fence(){
  const y=hy+84;x.strokeStyle='#c9a574';x.lineWidth=2;x.lineCap='butt';
  x.beginPath();x.moveTo(0,y-12);x.lineTo(W,y-12);x.moveTo(0,y-5);x.lineTo(W,y-5);x.stroke();
  x.lineWidth=3;x.beginPath();for(let i=10;i<W;i+=44){x.moveTo(i,y);x.lineTo(i,y-18);}x.stroke();
}
function birds(t){
  x.strokeStyle='#27456b';x.lineWidth=1.8;x.lineCap='round';
  [0,1,2,3].forEach(i=>{
    const bx=((t*.02*mot*(1+i*.15)+i*W*.28)%(W+80))-40,by=H*.12+i*22+Math.sin(t*.001+i)*8*mot,f=Math.sin(t*.008+i)*5*mot;
    x.beginPath();x.moveTo(bx-9,by-f);x.quadraticCurveTo(bx-4,by-6+f,bx,by);x.quadraticCurveTo(bx+4,by-6+f,bx+9,by-f);x.stroke();
  });
}
function butterflies(t){
  [0,1,2].forEach(i=>{
    const bx=px+Math.sin(t*.0006*mot+i*2)*(150+i*40)+(i-1)*30,by=py-Hm*(.25+i*.2)+Math.sin(t*.0013*mot+i)*30,w=Math.abs(Math.sin(t*.012*mot+i))*9+2;
    x.fillStyle=['#ff8a3d','#c06bff','#ffd23d'][i];
    x.beginPath();x.ellipse(bx-w/2,by,w,6,-.4,0,6.29);x.fill();
    x.beginPath();x.ellipse(bx+w/2,by,w,6,.4,0,6.29);x.fill();
    x.strokeStyle='#333';x.lineWidth=1.5;x.beginPath();x.moveTo(bx,by-5);x.lineTo(bx,by+5);x.stroke();
  });
}
function grass(t,front){
  x.lineCap='round';x.lineWidth=1.8;
  blades.forEach(b=>{
    if((b.y>py)!==front)return;
    const k=(b.y-hy)/(H-hy),h=8+k*30,sw=Math.sin(t*.002+b.p)*3*k*mot;
    x.strokeStyle=`hsl(${95+b.g*25},55%,${26+b.g*18}%)`;
    x.beginPath();x.moveTo(b.x,b.y);x.quadraticCurveTo(b.x+sw*.5,b.y-h*.6,b.x+sw,b.y-h);x.stroke();
  });
}
function P(s,t){return{x:px+Math.sin(s*.05)*14+Math.sin(t*.0012+s*.012)*(s/Hm)*7*mot,y:py-s};}

function post(){
  const top=py-Hm*1.06,w=14;
  const gr=x.createLinearGradient(px-w,0,px+w,0);gr.addColorStop(0,'#7a5535');gr.addColorStop(.5,'#a67c52');gr.addColorStop(1,'#80593a');
  x.fillStyle=gr;x.beginPath();x.roundRect(px-w/2,top,w,py-top+6,3);x.fill();
  x.strokeStyle='rgba(60,35,15,.35)';x.lineWidth=1;
  for(let i=0;i<9;i++){const y=top+20+i*(Hm*.11);x.beginPath();x.moveTo(px-w/2+2,y);x.lineTo(px+w/2-3,y+6);x.stroke();}
  x.fillStyle='#5a3d27';x.beginPath();x.ellipse(px,py+8,34,9,0,0,6.29);x.fill();
}
function leaf(n,dir,lg,t,k){
  if(lg<=0)return;
  const len=(100+(k%3)*10)*sc*lg,w=17*sc*lg,dr=len*.2;
  x.save();x.translate(n.x,n.y);
  x.rotate((dir>0?-.32:Math.PI+.32)+Math.sin(t*.0015+k)*.04*mot*dir);
  if(dir<0)x.scale(1,-1);
  const gr=x.createLinearGradient(0,0,len,0);gr.addColorStop(0,'#2d8438');gr.addColorStop(1,'#7ac650');
  x.fillStyle=gr;x.strokeStyle='rgba(15,70,25,.55)';x.lineWidth=1;
  x.beginPath();x.moveTo(0,0);
  x.bezierCurveTo(len*.3,-w*1.7,len*.75,-w*1.1,len,dr);
  x.bezierCurveTo(len*.75,w*.9,len*.3,w*1.4,0,0);x.fill();x.stroke();
  x.strokeStyle='rgba(215,245,160,.7)';x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(len*.5,-w*.1,len,dr);x.stroke();
  x.restore();
}
function flower(fx,fy,b,t){
  if(b<=0)return;
  const S=42*sc;
  if(b<.35){
    const q=b/.35;x.fillStyle='#c4d968';x.strokeStyle='#8fae3c';x.lineWidth=1;
    x.beginPath();x.ellipse(fx,fy,3+4*q,6+6*q,-.3,0,6.29);x.fill();x.stroke();return;
  }
  const o=(b-.35)/.65,r=S*(.4+.6*o);
  x.save();x.translate(fx,fy);x.rotate(Math.sin(t*.0014+fx)*.05*mot);
  x.fillStyle='#eef4a8';x.strokeStyle='#c2cf62';x.lineWidth=1;
  for(let i=0;i<5;i++){
    x.save();x.rotate(-1.5708+i*1.2566);
    x.beginPath();x.ellipse(r*.55,0,r*.55,r*.17,0,0,6.29);x.fill();x.stroke();x.restore();
  }
  x.fillStyle='#f7e27a';x.strokeStyle='#d6b038';
  x.beginPath();x.ellipse(0,r*.12,r*.2,r*.32,0,0,6.29);x.fill();x.stroke();
  x.fillStyle='#e3963a';x.beginPath();x.arc(0,r*.1,r*.06,0,6.29);x.fill();
  x.restore();
}
function plant(t){
  const L=8+g*(Hm-8);
  // tallo
  x.lineCap='round';
  for(let s=0;s<L;s+=4){
    const a=P(s,t),b=P(Math.min(s+4,L),t),k=s/Hm;
    x.strokeStyle=`hsl(${92+k*25},48%,${34+k*16}%)`;x.lineWidth=6-3*k;
    x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
  }
  // hojas y raíces aéreas
  let k=0;
  for(let s=34;s<=L;s+=46,k++){
    const n=P(s,t),dir=k%2?1:-1;
    if(k%2===0){
      const rl=40*sc*ease(clamp((L-s-10)/140));
      if(rl>1){x.strokeStyle='#bfcfa4';x.lineWidth=1.8;x.beginPath();x.moveTo(n.x,n.y);
        x.quadraticCurveTo(n.x-dir*8,n.y+rl*.5,n.x+dir*3+Math.sin(t*.002+k)*2*mot,n.y+rl);x.stroke();}
    }
    leaf(n,dir,ease(clamp((L-s)/90)),t,k);
  }
  // flores
  [.6,.72,.84].forEach((f,i)=>{
    const s=f*Hm,dir=i%2?-1:1,b=clamp((g-(.66+i*.08))/.13);
    if(b<=0||L<s)return;
    const n=P(s,t),e={x:n.x+dir*46*sc,y:n.y-30*sc};
    x.strokeStyle='#7fae3f';x.lineWidth=2.5;x.beginPath();x.moveTo(n.x,n.y);x.quadraticCurveTo(n.x+dir*26*sc,n.y-4,e.x,e.y);x.stroke();
    flower(e.x,e.y,b,t);
    flower(e.x+dir*38*sc,e.y-30*sc,b*.8-.1,t);
  });
  // punta nueva
  const tp=P(L,t);x.fillStyle='#b5e07a';x.beginPath();x.arc(tp.x,tp.y,3.6-1.5*g,0,6.29);x.fill();
}
function rain(dt){
  if(wet>0){wet-=dt;for(let i=0;i<2;i++)drops.push({x:px+(Math.random()-.5)*150,y:py-Hm*1.15-Math.random()*40,v:420+Math.random()*160});}
  x.strokeStyle='rgba(70,150,230,.85)';x.lineWidth=2;x.lineCap='round';
  drops=drops.filter(d=>{
    d.y+=d.v*dt/1000;
    x.beginPath();x.moveTo(d.x,d.y-9);x.lineTo(d.x,d.y);x.stroke();
    if(d.y>py+4){g=Math.min(1,g+.003);return false;}return true;
  });
}
const stageEl=document.getElementById('stage'),fillEl=document.getElementById('fill');
function stage(){
  const s=g<.06?'Esqueje recién plantado':g<.3?'Primer tallo trepando por el tutor':g<.6?'Hojas carnosas y raíces aéreas':g<.8?'Aparecen las primeras yemas':g<1?'Las flores se están abriendo':'Floración completa';
  if(s!==lastStage){stageEl.textContent=s;lastStage=s;}
  fillEl.style.width=(g*100).toFixed(1)+'%';
}
function frame(now){
  const dt=Math.min(now-last,60);last=now;
  g=Math.min(1,g+dt/75000);
  sky();
  clouds.forEach(o=>{o.x+=o.v*dt/1000*mot;if(o.x>W+120)o.x=-160;cloud(o);});
  birds(now);field();fence();grass(now,false);post();plant(now);grass(now,true);butterflies(now);rain(dt);stage();
  requestAnimationFrame(frame);
}
document.getElementById('water').onclick=()=>{wet=1400;};
document.getElementById('reset').onclick=()=>{g=0;drops=[];wet=0;};
requestAnimationFrame(frame);
</script>
</body>
</html>
